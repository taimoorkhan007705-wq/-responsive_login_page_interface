<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main class="login-card">
        <div class="form-container">
            <h1 class="logo-text">Logo Here</h1>
            <p class="welcome-msg">Welcome back !!!</p>
            <h2 class="login-title">Login</h2>

            <form>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="login@gmail.com">
                </div>

                <div class="input-group">
                    <label>Password</label>
                <div class="input-group">
    <div class="password-wrapper">
        <input type="password" id="password-field" placeholder="••••••">
    </div>
</div>
                </div>

                <a href="#" class="forgot-link">Forgot Password ?</a>

                <button type="submit" class="login-btn">
                    LOGIN <i class="fa-solid fa-angles-right"></i>
                </button>
            </form>

            <div class="social-divider">
                <span>or continue with</span>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-google"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                </div>
            </div>

            <p class="signup-text">Don't have an account yet? <a href="#">Sign up for free</a></p>
        </div>

        <div class="image-container">
            <img src="2.png" alt="Illustration">
        </div>
    </main>
</body>

</html>
